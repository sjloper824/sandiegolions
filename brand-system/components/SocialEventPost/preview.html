<!-- @dsCard group="Social" height=560 subtitle="Event feed post (1080 × 1350) and story (1080 × 1920), shown at 30%" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@500;700;800&family=Permanent+Marker&display=swap">
<style>
  body{margin:0;font-family:var(--font-body)}
  .row{display:flex;flex-wrap:wrap;gap:24px;padding:20px;align-items:flex-start}
  .post{zoom:.3;width:1080px;position:relative;overflow:hidden;box-sizing:border-box;padding:60px;background:#5F2037;color:#FFFFFF;font-family:var(--font-body)}
  .feed{height:1350px}
  .story{height:1920px;padding-top:250px;padding-bottom:340px}
  .script{height:150px;display:block;background:#FFFFFF;border-radius:24px;padding:14px 24px}
  .badge{position:absolute;right:60px;top:80px;background:#F7BC3C;color:#17110F;font-family:var(--font-marker);font-size:44px;padding:12px 32px 18px;transform:rotate(-3deg)}
  .story .badge{top:270px}
  figure{margin:60px 0 0;background:#FFFFFF;padding:20px;border-radius:33px;transform:rotate(-1.5deg);width:620px}
  figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px}
  .story figure{width:860px;margin-top:80px}
  .h{font-family:var(--font-display);text-transform:uppercase;font-size:150px;line-height:.95;margin:56px 0 0}
  .meta{margin-top:30px;font-size:34px;font-weight:700;color:#EEDBE1}
  .cta{display:inline-block;margin-top:40px;background:#F7BC3C;color:#17110F;font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase;padding:22px 40px;border-radius:3px}
</style>
<div class="row" data-theme="light">
  <div class="post feed">
    <img class="script" src="../../assets/Logos/script-wordmark.png" alt="San Diego Lions">
    <span class="badge">Costumes encouraged</span>
    <figure><img src="../../assets/Photos/social-costume.jpg" alt="Lions members in costume at a club social"></figure>
    <p class="h">Pie Day<br>is back.</p>
    <div class="meta">Sat [DD MMM] · [Time] · [Venue]</div>
    <span class="cta">RSVP in the event</span>
  </div>
  <div class="post story">
    <img class="script" src="../../assets/Logos/script-wordmark.png" alt="San Diego Lions">
    <span class="badge">Costumes encouraged</span>
    <figure><img src="../../assets/Photos/social-costume.jpg" alt="Lions members in costume at a club social"></figure>
    <p class="h">Pie Day<br>is back.</p>
    <div class="meta">Sat [DD MMM] · [Time] · [Venue]</div>
    <span class="cta">Tap to RSVP</span>
  </div>
</div>
