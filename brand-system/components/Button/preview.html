<!-- @dsCard group="Website" height=200 subtitle="Squared, uppercase, one primary per section" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;700;800&display=swap">
<style>
  body{margin:0;background:var(--white);font-family:var(--font-body)}
  .wrap{display:grid;gap:16px;padding:24px}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
  .btn{display:inline-block;text-decoration:none;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.05em;padding:15px 28px;border-radius:var(--r-btn);border:2px solid transparent;font-family:var(--font-body)}
  .primary{background:var(--yellow-500);color:var(--charcoal)}
  .maroon{background:var(--maroon-600);color:#FFFFFF}
  .ghost{border-color:var(--maroon-600);color:var(--maroon-600)}
  .link{font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--maroon-600);text-decoration:none;border-bottom:3px solid var(--yellow-500);padding-bottom:3px}
  .dark{background:var(--maroon-700);border-radius:var(--r-card);padding:20px}
  .ghost-dark{border-color:rgba(255,255,255,.7);color:#FFFFFF}
</style>
<div class="wrap">
  <div class="row">
    <a class="btn primary" href="#">Join the Lions</a>
    <a class="btn ghost" href="#">See the schedule</a>
    <a class="btn maroon" href="#">Join the Lions</a>
    <a class="link" href="#">See the training schedule →</a>
  </div>
  <div class="row dark">
    <a class="btn primary" href="#">RSVP</a>
    <a class="btn ghost-dark" href="#">Get in on the next one</a>
  </div>
</div>
