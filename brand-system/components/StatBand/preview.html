<!-- @dsCard group="Website" height=170 subtitle="Club numbers on a rounded maroon panel" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;700;800&display=swap">
<style>
  body{margin:0;background:var(--white);font-family:var(--font-body)}
  .band{margin:20px;background:var(--maroon-600);border-radius:var(--r-module);padding:32px 40px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;color:#FFFFFF}
  .stat+.stat{border-left:1px solid rgba(255,255,255,.25);padding-left:24px}
  b{display:block;font-family:var(--font-display);font-weight:400;font-size:37px;line-height:1.05;font-variant-numeric:tabular-nums}
  span{display:block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--maroon-100)}
</style>
<div class="band">
  <div class="stat"><b>1997</b><span>Club founded</span></div>
  <div class="stat"><b>4x</b><span>USAFL premierships (Div. 1, 2 &amp; 4)</span></div>
  <div class="stat"><b>100+</b><span>Active players &amp; supporters</span></div>
  <div class="stat"><b>15</b><span>Life members</span></div>
</div>
