<!-- @dsCard group="Website" height=380 subtitle="Rounded maroon or charcoal module, inset from the edge" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;700;800&family=Permanent+Marker&display=swap">
<style>
  body{margin:0;background:var(--white);font-family:var(--font-body)}
  .panel{margin:20px;background:var(--maroon-700);border-radius:var(--r-module);padding:40px 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;color:#FFFFFF}
  .badge{display:inline-block;background:var(--yellow-500);color:var(--charcoal);font-family:var(--font-marker);font-size:16px;padding:5px 14px 7px;transform:rotate(-2deg);margin-bottom:16px}
  .eyebrow{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow-500)}
  h2{margin:0;font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:34px;line-height:1}
  .rule{width:64px;height:5px;background:var(--yellow-500);margin:16px 0}
  p{margin:0 0 20px;font-size:14px;line-height:1.7;color:var(--maroon-100)}
  .btn{display:inline-block;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:13px 22px;border-radius:var(--r-btn);border:2px solid rgba(255,255,255,.7);color:#FFFFFF;text-decoration:none}
  figure{margin:0;background:var(--frame);padding:10px;border-radius:var(--r-frame);box-shadow:var(--shadow-frame);transform:rotate(1.4deg)}
  figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-photo)}
</style>
<section class="panel">
  <div>
    <span class="badge">Est. good times, ’97</span>
    <p class="eyebrow">Off the field</p>
    <h2>We’re a social club too.</h2>
    <div class="rule"></div>
    <p>The Lions run one of the best social calendars in San Diego club sport: Australia Day, Pie Day, the Crawfish Boil, the Flip Flop Formal and AFL Grand Final Night.</p>
    <a class="btn" href="#">Get in on the next one</a>
  </div>
  <figure><img src="../../assets/Photos/social-costume.jpg" alt="Lions members in costume at a club social"></figure>
</section>
