<!-- @dsCard group="Brand" height=260 subtitle="Lion lockup, crest, script wordmark: on white or knocked out to white" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<style>
  body{margin:0;font-family:var(--font-body)}
  .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:20px}
  .tile{border-radius:var(--r-card);height:170px;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .tile img{max-width:100%;max-height:130px;display:block}
  .w{background:#FFFFFF;border:2px solid #E6DCDF}
  .m{background:#7A2A45}
  .c{background:#17110F}
  .ko{filter:brightness(0) invert(1)}
  .cap{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:8px}
</style>
<div class="wrap" data-theme="light">
  <div><div class="tile w"><img src="../../assets/Logos/clean-logo.png" alt="San Diego Lions lion lockup"></div><div class="cap">Lion lockup · everyday</div></div>
  <div><div class="tile m"><img class="ko" src="../../assets/Logos/clean-logo.png" alt="Lion lockup knocked out to white"></div><div class="cap">Knocked out on maroon</div></div>
  <div><div class="tile w"><img src="../../assets/Logos/crest-logo.png" alt="San Diego Lions crest"></div><div class="cap">Crest · formal</div></div>
  <div><div class="tile w"><img src="../../assets/Logos/script-wordmark.png" alt="San Diego Lions script wordmark"></div><div class="cap">Script · socials &amp; merch</div></div>
</div>
