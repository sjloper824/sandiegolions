<!-- @dsCard group="Website" height=360 subtitle="Training card, next game card, schedule row" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600;700;800&display=swap">
<style>
  body{margin:0;background:var(--white);font-family:var(--font-body)}
  .wrap{display:grid;gap:16px;padding:20px 24px}
  .card{border-radius:var(--r-module);padding:22px 30px}
  .train{background:var(--charcoal);color:#FFFFFF}
  .game{background:var(--white);border:2px solid var(--charcoal);color:var(--ink)}
  .lbl{margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .train .lbl,.train b{color:var(--yellow-500)}
  .game .lbl,.game b{color:var(--maroon-600)}
  .items{display:flex;flex-wrap:wrap;gap:24px}
  .items div{flex:1 1 140px}
  b{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  .v{font-family:var(--font-display);font-size:19px;text-transform:uppercase;letter-spacing:.02em}
  h3{margin:0 0 12px;font-family:var(--font-display);font-weight:400;font-size:26px;text-transform:uppercase}
  h3 span{color:var(--maroon-600)}
  .row{display:grid;grid-template-columns:64px 1fr 1fr;gap:20px;align-items:center;border-top:3px solid var(--charcoal);border-bottom:2px solid var(--line);padding:14px 0}
  .date{background:var(--charcoal);color:#FFFFFF;border-radius:12px;text-align:center;padding:8px 4px}
  .date small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--yellow-500)}
  .date strong{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.05}
  .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:var(--r-btn);background:var(--maroon-600);color:#FFFFFF;margin-bottom:6px}
  .tag.s{background:var(--yellow-500);color:var(--charcoal)}
  .row h4{margin:0;font-family:var(--font-display);font-weight:400;font-size:20px;text-transform:uppercase;color:var(--ink)}
  .meta{font-size:13px;font-weight:600;color:var(--ink)}
</style>
<div class="wrap">
  <div class="card train"><p class="lbl">Training</p><div class="items"><div><b>Days</b><span class="v">Tuesdays &amp; Thursdays</span></div><div><b>Time</b><span class="v">5:30 – 7:30 PM</span></div><div><b>Where</b><span class="v">Nobel Athletic Area</span></div></div></div>
  <div class="card game"><p class="lbl">Next game</p><h3>Lions <span>vs</span> [Opponent]</h3><div class="items"><div><b>Date</b><span class="v">[Date]</span></div><div><b>First bounce</b><span class="v">[Time]</span></div><div><b>Where</b><span class="v">[Venue]</span></div></div></div>
  <div class="row"><div class="date"><small>[MON]</small><strong>[DD]</strong></div><div><span class="tag s">Social</span><h4>Pie Day</h4></div><div class="meta">[Time] · [Venue]</div></div>
</div>
